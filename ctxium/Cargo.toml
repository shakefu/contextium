[package]
name = "ctxium"
version = "0.1.0"
edition = "2021"
description = "CLI for Contextium - context management for AI coding agents"
license = "Apache-2.0"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for hook command)
reqwest = { version = "0.12", features = ["json"] }

# HTTP server (for hookserver command)
axum = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Colored output
colored = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
