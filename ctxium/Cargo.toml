[package]
name = "ctxium"
version = "0.1.0"
edition = "2021"
description = "CLI for Contextium - context management for AI coding agents"
license = "Apache-2.0"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for hook command)
reqwest = { version = "0.13", features = ["json"] }

# HTTP server (for hookserver command)
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Colored output
colored = "3"

# Archive extraction (for bootstrap)
tar = "0.4"
flate2 = "1.1"

# Temp directories
tempfile = "3"

# Cross-platform home directory
dirs = "6"

# Async trait support
async-trait = "0.1"

# Futures for concurrent execution
futures = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
