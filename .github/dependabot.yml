version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Keep Rust dependencies up to date
  - package-ecosystem: "cargo"
    directory: "/ctxium"
    schedule:
      interval: "weekly"
    groups:
      rust-deps:
        patterns: ["*"]
